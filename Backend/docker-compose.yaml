services:
  backend:
    build: .
    ports:
      - "2001:2001"
    volumes:
      - .:/home/node/eAtik
      - node_modules_data:/home/node/eAtik/node_modules
    environment:
      - NODE_ENV=development
      - PORT=${PORT}
      - DATABASE_URL=postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5434:5434"
    volumes:
      - postgres-data:/var/lib/postgresql/data
volumes:
  node_modules_data:
  postgres-data:
